# Config File defining what tools will be installed how/in what order

# ===============================================================
# 0. PROFILE DEFINITIONS
# ===============================================================
# Declares what each install profile (see .chezmoi.toml.tmpl's `profile`
# prompt) is capable of. Tiers that need a capability check it generically
# here instead of hardcoding profile names in the dispatcher scripts --
# adding a new profile, or a new capability dimension, is a pure data change
# with no script edits. `sudo` gates the whole [system_tools] tier and native
# [gui_apps] installs; `gui` additionally gates the [gui_apps] tier (on top
# of the existing display-server runtime check).
#
# Individual entries in the tiers below can further restrict themselves to a
# subset of profiles with a `profiles = [...]` key (see the
# "entry-in-profile" partial in .chezmoitemplates) -- e.g. to exclude a
# desktop-integration package from "headless" even though headless has sudo,
# or a heavyweight toolchain from "minimal" for resource reasons even though
# nothing about it needs sudo. Omitting `profiles` on an entry means it's
# available on every profile the tier's capability gate allows -- keeps
# "just add a line" true for the common case.
[profiles.standard]
sudo = true
gui = true

[profiles.headless]
sudo = true
gui = false

[profiles.minimal]
sudo = false
gui = false

# ===============================================================
# 1. OS LAYER (Requires Sudo / Native Package Manager)
# ===============================================================
[system_tools]
tailscale = "latest"
curl = "latest"
git = "latest"
zsh = "latest"
flatpak = { version = "latest", profiles = ["standard"] } # Only needed to back the GUI tier
# software-properties-common = "latest" # This is Ubuntu/Debian specific, need to gate it.
shfmt = "latest"
clangd = "latest"
lldb = "latest"
# Per-distro package names differ (Fedora capitalizes/hyphenates differently
# than Debian/Ubuntu's naming scheme); each distro must have an entry or
# `chezmoi apply` will fail loudly on that OS rather than guess a name.
# strongswan-vpn(-gnome)/nm-connection-editor are desktop-integration VPN
# tooling -- not useful on a headless box even though headless has sudo, so
# both are restricted to "standard" via `profiles` rather than relying on
# the tier-level sudo gate alone.
strongswan-vpn = { profiles = ["standard"], fedora = { name = "NetworkManager-strongswan", version = "latest" }, ubuntu = { name = "network-manager-strongswan", version = "latest" }, debian = { name = "network-manager-strongswan", version = "latest" } }
strongswan-vpn-gnome = { profiles = ["standard"], fedora = { name = "NetworkManager-strongswan-gnome", version = "latest" }, ubuntu = { name = "network-manager-strongswan", version = "latest" }, debian = { name = "network-manager-strongswan", version = "latest" } }
nm-connection-editor = { version = "latest", profiles = ["standard"] }
# wireshark = "latest" # Commented out, will be ignored

# ===============================================================
# 2. COMPILER/RUNTIME LAYER (Custom scripts)
# ===============================================================
[external_user_tools]
# rust and claude-code are both sudo-free curl installers, so both are
# available on every profile's *capability* grounds; both are still
# restricted below for resource-footprint reasons on "minimal" -- rust's
# toolchain is ~1GB, and claude-code (~150-250MB) is bigger than the rest of
# the "minimal" tool list combined.
rust        = { version = "stable", kind = "toolchains", profiles = ["standard", "headless"] }
claude-code = { version = "stable", kind = "standalone", profiles = ["standard", "headless"] }

# ===============================================================
# 3. CLI APPLICATION LAYER (Managed via Mise)
# ===============================================================
# Tools to be installed by `mise`
# Version is set to "latest"
# Format is "<Mise Format>" = "<Executable/binary name>", or
# "<Mise Format>" = { bin = "<Executable/binary name>", profiles = [...] }
# for entries restricted off the default of "available on every profile"
# (e.g. resource-heavy dev tooling excluded from "minimal").
[user_tools]
node = { bin = "latest", profiles = ["standard", "headless"] } # Needed by the npm: LSPs below

# Bare names below resolve through mise's own registry, which prefers a
# prebuilt-binary backend (aqua, confirmed via `mise install -v`) over
# cargo: when one exists -- same upstream release binary cargo-binstall
# would fetch anyway on standard/headless, but with no dependency on a
# `cargo` binary being present, which is what makes these installable on
# "minimal" (no rust toolchain at all) without any compile fallback.
zellij = "zellij"  # Modern Window/pane/tile/session manager
ripgrep = "rg"  # Modern `grep`
# "cargo:fd-find" = "fd"  # Modern `find` # Comes pre-installed on Fedora COSMIC Spin, need to gate/check
bat = "bat"  # Modern `cat`
eza = "eza"  # Modern `ls`
sheldon = "sheldon"  # Zsh Plugin Manager
"cargo:comrak" = { bin = "comrak", profiles = ["standard", "headless"] } # No aqua backend for this one; stays cargo: (fine, excluded from minimal anyway)
# zsh-patina has no mise registry entry at all (bare name wouldn't resolve),
# but it does publish prebuilt GitHub release binaries -- the `github:`
# backend fetches those directly, same no-cargo-needed rationale as above.
# (mise's older `ubi:` backend does the same thing but is deprecated as of
# this mise version, scheduled for removal in 2027.1.0 -- use `github:`.)
"github:michel-kraemer/zsh-patina" = "zsh-patina"

# NPM Tools (require node, so excluded wherever node is)
"npm:bash-language-server" = { bin = "bash-language-server", profiles = ["standard", "headless"] }
"npm:prettier" = { bin = "prettier", profiles = ["standard", "headless"] }

"uv" = { bin = "uv", profiles = ["standard", "headless"] } # Only needed to back the pipx: LSPs/formatters below

# GitHub Binaries (Managed automatically via asdf community plugins)
helix = "hx"  # Core editor kept on every profile -- valuable precisely where there's no GUI editor; LSPs below stay standard+headless only
marksman = { bin = "marksman", profiles = ["standard", "headless"] }
cargo-binstall = "cargo-binstall"  # mise will automatically use cargo-binstall if installed; needed by every cargo: entry above, incl. on minimal
zoxide = "zoxide"
fzf = "fzf"
starship = "starship"
gh = "gh"
yazi = { bin = "ya", profiles = ["standard", "headless"] } # Terminal file manager; image-preview deps add weight, skip on minimal
atuin = "atuin"

# Pipx Tools (Python dev tooling; excluded from minimal along with uv above)
# These will be installed using `uv` by default.
"pipx:ruff" = { bin = "ruff", profiles = ["standard", "headless"] }
"pipx:basedpyright" = { bin = "basedpyright", profiles = ["standard", "headless"] }
"pipx:tombi" = { bin = "tombi", profiles = ["standard", "headless"] }  # For TOML formatting

# ===============================================================
# 4. DESKTOP/GUI LAYER (Flatpak IDs or Script Arguments)
# ===============================================================
[gui_apps]
ghostty = "custom_script"  # Value unused; installed via .scripts/gui/ghostty.sh.tmpl (official mkasberg/ghostty-ubuntu installer)
brave = "com.brave.Browser"
bitwarden = "com.bitwarden.desktop"
vlc = "org.videolan.VLC"
firefox = { native = true }  # Native package (apt/dnf/pacman); gated by 03's headless guard. See .scripts/personal/firefox/configure.sh.tmpl for opt-in prefs/extensions sync.

# ===============================================================
# 5. PERSONAL LAYER (Optional, per-machine opt-in)
# ===============================================================
# Opinionated, user-specific customizations that not everyone forking this
# repo will want. Nothing here is required by the core dispatcher scripts;
# comment out a line to skip that customization on a given machine.
[personal.firefox]
active = true  # Opts into this app's personal customization (Betterfox prefs + enterprise-policy extensions below). Enforced centrally by run_after_20_configure_personal.sh.tmpl -- the per-app script isn't even invoked when this is false.

# Extensions to force-install via Firefox's enterprise policy engine (can't be
# disabled/removed by accident; installed with no user prompt). Key = the
# extension's ID (from about:debugging or its manifest), value = its AMO
# ("addons.mozilla.org") URL slug. Add/remove/comment a line to change what
# gets installed.
[personal.firefox.extensions]
"uBlock0@raymondhill.net" = "ublock-origin"
"{446900e4-71c2-419f-a6a7-df9c091e268b}" = "bitwarden-password-manager"
"floccus@handmadeideas.org" = "floccus"

# Enforces a battery charge-limit on laptops using the `dell_laptop` kernel
# driver (Dell Latitude/Inspiron/Precision/XPS). That driver only respects
# charge_control_start/end_threshold when charge_types is set to "Custom" --
# in the default "Fast"/"Standard"/"Adaptive" modes the thresholds are
# silently ignored and the battery charges to 100% every time, accelerating
# long-term capacity fade. `battery` is the power_supply name to target
# (check `ls /sys/class/power_supply/` -- usually BAT0). 80% end is the
# conventional longevity sweet spot (Li-ion aging accelerates above
# ~80-90% state-of-charge); 50% start just means "don't resume charging
# above 50%" -- it barely matters if the machine mostly stays plugged in,
# since it'll simply sit parked at `end` instead of cycling.
#
# `requires = "laptop"` scopes this to machines where .chezmoi.toml.tmpl's
# `laptop` prompt was answered true (see run_after_20_configure_personal.sh.tmpl
# for how that's checked) -- so this table is safe to leave `active = true`
# on every machine, laptop or not; it's a no-op on desktops.
[personal.battery_charge_threshold]
active = true  # Opts into this customization. Enforced centrally by run_after_20_configure_personal.sh.tmpl -- set to false (or delete this table) to disable outright, independent of the requires/laptop gate.
requires = "laptop"
battery = "BAT0"
start = 50
end = 80
