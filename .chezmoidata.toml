# Config File defining what tools will be installed how/in what order

# ===============================================================
# 1. OS LAYER (Requires Sudo / Native Package Manager)
# ===============================================================
[system_tools]
tailscale = "latest"
curl = "latest"
git = "latest"
zsh = "latest"
flatpak = "latest"
# software-properties-common = "latest" # This is Ubuntu/Debian specific, need to gate it.
shfmt = "latest"
clangd = "latest"
lldb = "latest"
# Per-distro package names differ (Fedora capitalizes/hyphenates differently
# than Debian/Ubuntu's naming scheme); each distro must have an entry or
# `chezmoi apply` will fail loudly on that OS rather than guess a name.
strongswan-vpn = { fedora = { name = "NetworkManager-strongswan", version = "latest" }, ubuntu = { name = "network-manager-strongswan", version = "latest" }, debian = { name = "network-manager-strongswan", version = "latest" } }
strongswan-vpn-gnome = { fedora = { name = "NetworkManager-strongswan-gnome", version = "latest" }, ubuntu = { name = "network-manager-strongswan", version = "latest" }, debian = { name = "network-manager-strongswan", version = "latest" } }
nm-connection-editor = "latest"
# wireshark = "latest" # Commented out, will be ignored

# ===============================================================
# 2. COMPILER/RUNTIME LAYER (Custom scripts)
# ===============================================================
[external_user_tools]
rust        = { version = "stable", kind = "toolchains" }
claude-code = { version = "stable", kind = "standalone" }

# ===============================================================
# 3. CLI APPLICATION LAYER (Managed via Mise)
# ===============================================================
# Tools to be installed by `mise`
# Version is set to "latest"
# Format is "<Mise Format>" = "<Executable/binary name>"
[user_tools]
node = "latest"

"cargo:zellij" = "zellij"  # Modern Window/pane/tile/session manager
"cargo:ripgrep" = "rg"  # Modern `grep`
# "cargo:fd-find" = "fd"  # Modern `find` # Comes pre-installed on Fedora COSMIC Spin, need to gate/check
"cargo:bat" = "bat"  # Modern `cat`
"cargo:eza" = "eza"  # Modern `ls`
"cargo:sheldon" = "sheldon"  # Zsh Plugin Manager
"cargo:comrak" = "comrak"

# NPM Tools
"npm:bash-language-server" = "bash-language-server"
"npm:prettier" = "prettier"

"uv" = "uv"

# GitHub Binaries (Managed automatically via asdf community plugins)
helix = "hx"
marksman = "marksman"
cargo-binstall = "cargo-binstall"  # mise will automatically use cargo-binstall if installed
zoxide = "zoxide"
fzf = "fzf"
starship = "starship"
gh = "gh"
yazi = "ya" # Terminal file manager

# Pipx Tools
# These will be installed using `uv` by default.
"pipx:ruff" = "ruff"
"pipx:basedpyright" = "basedpyright"
"pipx:tombi" = "tombi"  # For TOML formatting

# ===============================================================
# 4. DESKTOP/GUI LAYER (Flatpak IDs or Script Arguments)
# ===============================================================
[gui_apps]
ghostty = "custom_script"  # Value unused; installed via .scripts/gui/ghostty.sh.tmpl (official mkasberg/ghostty-ubuntu installer)
brave = "com.brave.Browser"
bitwarden = "com.bitwarden.desktop"
vlc = "org.videolan.VLC"
firefox = { native = true }  # Native package (apt/dnf/pacman); gated by 03's headless guard. See .scripts/personal/firefox/configure.sh.tmpl for opt-in prefs/extensions sync.

# ===============================================================
# 5. PERSONAL LAYER (Optional, per-machine opt-in)
# ===============================================================
# Opinionated, user-specific customizations that not everyone forking this
# repo will want. Nothing here is required by the core dispatcher scripts;
# comment out a line to skip that customization on a given machine.
[personal.firefox]
active = true  # Opts into this app's personal customization (Betterfox prefs + enterprise-policy extensions below). Enforced centrally by run_after_20_configure_personal.sh.tmpl -- the per-app script isn't even invoked when this is false.

# Extensions to force-install via Firefox's enterprise policy engine (can't be
# disabled/removed by accident; installed with no user prompt). Key = the
# extension's ID (from about:debugging or its manifest), value = its AMO
# ("addons.mozilla.org") URL slug. Add/remove/comment a line to change what
# gets installed.
[personal.firefox.extensions]
"uBlock0@raymondhill.net" = "ublock-origin"
"{446900e4-71c2-419f-a6a7-df9c091e268b}" = "bitwarden-password-manager"
"floccus@handmadeideas.org" = "floccus"
